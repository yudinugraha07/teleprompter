<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Teleprompter</title>
    <meta name="theme-color" content="#05081F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Picaloid Studios design tokens, copied from the brand kit
         (brand-identity/brand/web/tokens.css). Only what this app uses. */
      :root {
        --navy-25: #f8f8fa;
        --navy-50: #f1f1f5;
        --navy-100: #e8e8ef;
        --navy-200: #dadae6;
        --navy-400: #9698b7;
        --navy-500: #6f709c;
        --navy-600: #505288;
        --navy-700: #373976;
        --navy-900: #161960;
        --navy-950: #0b0f3a;
        --navy-1000: #05081f;
        --blue-100: #d7f1fc;
        --blue-500: #02a6ed;
        --blue-700: #0975bc;
        --white: #ffffff;
        --error: #c0283e;
        --error-bg: #f9e9ec;

        --color-text-on-dark-muted: rgba(255, 255, 255, 0.72);
        --color-border: var(--navy-200);
        --color-border-subtle: var(--navy-100);
        --color-border-on-dark: rgba(255, 255, 255, 0.16);
        --focus-ring: 0 0 0 2px var(--white), 0 0 0 4px var(--navy-900);
        --focus-ring-on-dark: 0 0 0 2px var(--navy-950), 0 0 0 4px var(--blue-500);

        --font-heading: "Inter Tight", system-ui, sans-serif;
        --font-body: "Inter", system-ui, sans-serif;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-full: 999px;

        --duration-fast: 120ms;
        --duration-base: 200ms;
        --duration-slow: 320ms;
        --ease: cubic-bezier(0.2, 0, 0, 1);

        /* App roles: the prompter sits on the camera feed (dark),
           the script editor is a light sheet. */
        --panel: rgba(11, 15, 58, 0.72); /* navy-950 */
        --scrim: rgba(5, 8, 31, 0.8); /* navy-1000 */
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--navy-1000);
        color: var(--white);
        font: 400 16px/1.6 var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
      }
      button {
        font-family: inherit;
      }

      .icon {
        width: 20px;
        height: 20px;
        flex: none;
      }

      /* Buttons (brand kit .btn variants) */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 44px;
        padding: 0 var(--space-5);
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font: 600 15px/1 var(--font-body);
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color var(--duration-fast) var(--ease),
          border-color var(--duration-fast) var(--ease),
          color var(--duration-fast) var(--ease);
      }
      .btn .icon {
        width: 18px;
        height: 18px;
      }
      .btn--sm {
        height: 36px;
        padding: 0 var(--space-4);
        font-size: 14px;
      }
      .btn--lg {
        height: 52px;
        padding: 0 var(--space-6);
        font-size: 16px;
      }
      .btn--primary {
        background: var(--navy-900);
        color: var(--white);
      }
      .btn--primary:hover {
        background: var(--navy-700);
      }
      .btn--secondary {
        background: transparent;
        color: var(--navy-900);
        border-color: var(--navy-900);
      }
      .btn--secondary:hover {
        background: var(--navy-50);
      }
      .btn--accent {
        background: var(--blue-500);
        color: var(--navy-900);
      }
      .btn--accent:hover {
        background: color-mix(in srgb, var(--blue-500) 78%, var(--white));
      }
      .btn--outline-light {
        background: var(--panel);
        color: var(--white);
        border-color: rgba(255, 255, 255, 0.4);
      }
      .btn--outline-light:hover {
        border-color: var(--white);
      }
      .btn:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .on-dark .btn:focus-visible {
        box-shadow: var(--focus-ring-on-dark);
      }
      .on-dark .btn:disabled {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.4);
        border-color: transparent;
        cursor: not-allowed;
      }

      /* Square icon control over the camera feed */
      .ctrl {
        width: 52px;
        height: 52px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--color-border-on-dark);
        border-radius: var(--radius-md);
        color: var(--white);
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition:
          background-color var(--duration-fast) var(--ease),
          border-color var(--duration-fast) var(--ease),
          color var(--duration-fast) var(--ease);
      }
      .ctrl:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .ctrl:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring-on-dark);
      }
      .ctrl.active {
        color: var(--blue-500);
        border-color: var(--blue-500);
      }
      .ctrl--sm {
        width: 36px;
        height: 36px;
      }
      .ctrl--sm .icon {
        width: 18px;
        height: 18px;
      }

      #camera {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: var(--navy-1000);
        z-index: 0;
      }
      #camera.hidden {
        display: none;
      }

      #camera-fallback {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: var(--space-4);
        padding: var(--space-5);
        text-align: center;
        background: var(--navy-1000);
        color: var(--color-text-on-dark-muted);
        font-size: 14px;
        line-height: 1.5;
      }
      #camera-fallback.hidden {
        display: none;
      }
      .fallback-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.08);
        color: var(--blue-500);
        display: grid;
        place-items: center;
      }
      .fallback-icon .icon {
        width: 24px;
        height: 24px;
      }
      #fallback-msg {
        margin: 0;
        max-width: 320px;
      }

      /* Tally light */
      #tally {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 25px);
        left: var(--space-4);
        width: 10px;
        height: 10px;
        border-radius: var(--radius-full);
        background: var(--navy-400);
        z-index: 30;
        transition: background-color var(--duration-base) var(--ease);
      }
      #tally.live {
        background: var(--blue-500);
        box-shadow: 0 0 0 4px rgba(2, 166, 237, 0.24);
        animation: pulse 1.6s var(--ease) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Scroll text overlay */
      #stage {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: auto;
      }
      #track {
        width: 100%;
        padding: calc(env(safe-area-inset-top, 0px) + 64px) var(--space-4) 0;
        will-change: transform;
        transform: translateY(0);
      }
      #track.mirror {
        transform: scaleX(-1);
      }
      .line-block {
        background: var(--panel);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        padding: var(--space-4) var(--space-5);
        border-radius: var(--radius-lg);
      }
      #script-text {
        font-family: var(--font-body);
        font-weight: 600;
        line-height: 1.5;
        color: var(--white);
        text-shadow: 0 1px 3px rgba(5, 8, 31, 0.6);
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 0;
      }

      /* Center reading guide line */
      #guide {
        position: fixed;
        left: 0;
        right: 0;
        top: 38%;
        height: 2px;
        background: var(--blue-500);
        opacity: 0.6;
        z-index: 11;
        pointer-events: none;
        display: none;
      }
      #guide.on {
        display: block;
      }

      /* Start countdown */
      #countdown {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font: 800 128px/1 var(--font-heading);
        letter-spacing: -0.03em;
        color: var(--white);
        text-shadow: 0 2px 16px rgba(5, 8, 31, 0.6);
      }
      #countdown.show {
        display: flex;
      }

      /* Top bar (minimal, shows on tap) */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        padding: calc(env(safe-area-inset-top, 0px) + var(--space-3))
          var(--space-4) var(--space-3) 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(to bottom, var(--scrim), transparent);
        transition:
          opacity var(--duration-base) var(--ease),
          transform var(--duration-base) var(--ease);
      }
      #topbar.hide {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
      #status-label {
        font: 600 12px/1.4 var(--font-body);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-text-on-dark-muted);
      }
      #status-label.live {
        color: var(--blue-500);
      }
      #topbar-actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      #record-btn .icon {
        width: 16px;
        height: 16px;
      }
      #record-btn .icon-stop,
      #record-btn.recording .icon-record {
        display: none;
      }
      #record-btn.recording .icon-stop {
        display: block;
      }
      #record-btn .icon-record {
        color: var(--error);
      }
      #record-btn.recording {
        background: var(--error);
        border-color: var(--error);
        color: var(--white);
        animation: pulse 1.6s var(--ease) infinite;
      }

      /* Bottom control dock */
      #dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        padding: var(--space-6) var(--space-4)
          calc(env(safe-area-inset-bottom, 0px) + var(--space-4));
        background: linear-gradient(to top, var(--scrim) 60%, transparent);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        transition:
          opacity var(--duration-base) var(--ease),
          transform var(--duration-base) var(--ease);
      }
      #dock.hide {
        opacity: 0;
        transform: translateY(100%);
        pointer-events: none;
      }

      .controls-row {
        display: flex;
        gap: var(--space-2);
      }
      .stepper-row {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-2);
        background: var(--panel);
        border: 1px solid var(--color-border-on-dark);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .stepper-label {
        padding: 0 var(--space-1);
        font: 600 12px/1.4 var(--font-body);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-text-on-dark-muted);
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .stepper-value {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 2px;
        font: 600 13px/1 var(--font-body);
        color: var(--color-text-on-dark-muted);
      }
      .value-input {
        width: 34px;
        padding: 0 0 2px;
        background: transparent;
        border: none;
        border-bottom: 1px solid transparent;
        border-radius: 0;
        color: var(--white);
        font: 700 20px/1.2 var(--font-heading);
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        text-align: right;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: border-color var(--duration-fast) var(--ease);
      }
      .value-input::-webkit-outer-spin-button,
      .value-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        appearance: none;
        margin: 0;
      }
      .value-input:hover {
        border-bottom-color: var(--color-border-on-dark);
      }
      .value-input:focus {
        border-bottom-color: var(--blue-500);
        outline: none;
      }

      .stepper-btn {
        width: 44px;
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--color-border-on-dark);
        color: var(--white);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition:
          background-color var(--duration-fast) var(--ease),
          border-color var(--duration-fast) var(--ease),
          color var(--duration-fast) var(--ease);
      }
      .stepper-btn:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .stepper-btn:active {
        border-color: var(--blue-500);
        color: var(--blue-500);
      }
      .stepper-btn:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring-on-dark);
      }
      .stepper-btn:disabled {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.4);
        cursor: not-allowed;
      }

      /* Label beside the buttons instead of above them */
      .stepper-row--inline {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .stepper-row--inline .stepper-value {
        flex: none;
        width: 64px;
      }

      /* Small-height landscape phones: keep the dock to two short rows
         so it doesn't crowd out the script preview. */
      @media (orientation: landscape) and (max-height: 500px) {
        #dock {
          gap: var(--space-2);
          padding: var(--space-4) var(--space-4)
            calc(env(safe-area-inset-bottom, 0px) + var(--space-2));
        }
        .controls-row .stepper-row {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: var(--space-3);
          padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3);
        }
        .controls-row .stepper-value {
          flex: none;
          width: 64px;
        }
        .stepper-btn {
          width: 36px;
          height: 36px;
        }
        .ctrl,
        #play-btn {
          height: 44px;
        }
        .ctrl:not(.ctrl--sm) {
          width: 44px;
        }
      }

      #main-controls {
        display: flex;
        gap: var(--space-2);
        align-items: center;
      }
      #play-btn {
        flex: 1;
        min-width: 0;
        padding: 0 var(--space-4);
      }
      #play-btn .icon-pause,
      #play-btn.playing .icon-play {
        display: none;
      }
      #play-btn.playing .icon-pause {
        display: block;
      }
      #play-btn .icon {
        fill: currentColor;
      }
      @media (max-width: 479px) {
        .ctrl:not(.ctrl--sm) {
          width: 44px;
          height: 44px;
        }
        #play-btn {
          height: 44px;
          padding: 0 var(--space-3);
          font-size: 15px;
        }
      }

      /* Editor sheet (light surface) */
      #editor {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: var(--white);
        color: var(--navy-900);
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform var(--duration-slow) var(--ease);
      }
      #editor.open {
        transform: translateY(0);
      }
      #editor-header {
        padding: calc(env(safe-area-inset-top, 0px) + var(--space-4))
          var(--space-4) var(--space-4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        border-bottom: 1px solid var(--color-border-subtle);
      }
      .eyebrow {
        font: 600 12px/1.4 var(--font-body);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--blue-700);
      }
      #editor-header h1 {
        margin: 2px 0 0;
        font: 600 20px/1.3 var(--font-heading);
        letter-spacing: -0.01em;
      }
      #editor-header .sub {
        margin: 2px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--navy-600);
      }
      #editor-header .header-actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .notice {
        display: none;
        gap: var(--space-3);
        margin: var(--space-3) var(--space-4) 0;
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        background: var(--error-bg);
        color: var(--navy-900);
        font-size: 14px;
        line-height: 1.5;
      }
      .notice .icon {
        color: var(--error);
        margin-top: 1px;
      }
      .notice.show {
        display: flex;
      }
      #script-input {
        flex: 1;
        width: 100%;
        background: var(--white);
        color: var(--navy-900);
        border: none;
        outline: none;
        resize: none;
        padding: var(--space-5) var(--space-4);
        font: 400 18px/1.6 var(--font-body);
      }
      #script-input::placeholder {
        color: var(--navy-500);
      }

      /* Font size row inside editor footer */
      #editor-footer {
        display: flex;
        padding: var(--space-3) var(--space-4)
          calc(env(safe-area-inset-bottom, 0px) + var(--space-3));
        border-top: 1px solid var(--color-border-subtle);
        background: var(--navy-25);
      }
      #editor-footer .stepper-row {
        background: var(--white);
        border-color: var(--color-border);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      #editor-footer .stepper-label,
      #editor-footer .stepper-value {
        color: var(--navy-600);
      }
      #editor-footer .value-input {
        color: var(--navy-900);
      }
      #editor-footer .value-input:hover {
        border-bottom-color: var(--color-border);
      }
      #editor-footer .value-input:focus {
        border-bottom-color: var(--navy-900);
      }
      #editor-footer .stepper-btn {
        background: var(--white);
        color: var(--navy-900);
        border-color: var(--color-border);
      }
      #editor-footer .stepper-btn:hover {
        border-color: var(--navy-400);
      }
      #editor-footer .stepper-btn:active {
        background: var(--navy-50);
        border-color: var(--navy-900);
        color: var(--navy-900);
      }
      #editor-footer .stepper-btn:focus-visible {
        box-shadow: var(--focus-ring);
      }
      #editor-footer .stepper-btn:disabled {
        background: var(--navy-50);
        border-color: var(--navy-100);
        color: var(--navy-400);
      }
    </style>
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <div id="camera-fallback" class="hidden">
      <div class="fallback-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34m-7.72-2.06a4 4 0 1 1-5.56-5.56"/></svg>
      </div>
      <p id="fallback-msg">
        Camera permission is needed to show the preview.<br />Tap the switch
        camera button below to try again.
      </p>
    </div>

    <div id="tally"></div>
    <div id="guide"></div>
    <div id="countdown"></div>

    <div id="stage">
      <div id="track">
        <div class="line-block">
          <p id="script-text">Tap the pencil icon below to paste your script here.</p>
        </div>
      </div>
    </div>

    <div id="topbar" class="on-dark">
      <span id="status-label">Ready</span>
      <div id="topbar-actions">
        <button class="ctrl ctrl--sm" id="record-btn" aria-label="Record">
          <svg class="icon icon-record" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>

    <script>
      (function () {
        const track = document.getElementById("track");
        const scriptText = document.getElementById("script-text");
        const playBtn = document.getElementById("play-btn");
        const playText = document.getElementById("play-text");
        const speedInput = document.getElementById("speed-input");
        const sizeInput = document.getElementById("size-input");
        const sizeInput2 = document.getElementById("size-input-2");
        const mirrorBtn = document.getElementById("mirror-btn");
        const guideBtn = document.getElementById("guide-btn");
        const guide = document.getElementById("guide");
        const countdown = document.getElementById("countdown");
        const editBtn = document.getElementById("edit-btn");
        const editor = document.getElementById("editor");
        const doneBtn = document.getElementById("done-btn");
        const scriptInput = document.getElementById("script-input");
        const loadBtn = document.getElementById("load-btn");
        const fileInput = document.getElementById("file-input");
        const loadError = document.getElementById("load-error");
        const loadErrorText = document.getElementById("load-error-text");
        const flipCamBtn = document.getElementById("flip-cam-btn");
        const restartBtn = document.getElementById("restart-btn");
        const camera = document.getElementById("camera");
        const cameraFallback = document.getElementById("camera-fallback");
        const fallbackMsg = document.getElementById("fallback-msg");
        const tally = document.getElementById("tally");
        const topbar = document.getElementById("topbar");
        const dock = document.getElementById("dock");
        const statusLabel = document.getElementById("status-label");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const stage = document.getElementById("stage");
        const recordBtn = document.getElementById("record-btn");

        let playing = false;
        let scrollY = 0;
        let rafId = null;
        let lastTs = null;
        let facingMode = "user";
        let currentStream = null;
        let controlsVisible = true;
        let hideTimer = null;
        let countdownTimer = null;
        let needsCountdown = true;
        let recording = false;
        let mediaRecorder = null;
        let recordedChunks = [];

        // ---- Camera ----
        function applyStream(stream) {
          currentStream = stream;
          camera.srcObject = stream;
          camera.classList.remove("hidden");
          cameraFallback.classList.add("hidden");
          camera.style.transform =
            facingMode === "user" ? "scaleX(-1)" : "none";
        }
        async function startCamera() {
          if (currentStream) {
            currentStream.getTracks().forEach((t) => t.stop());
          }
          const videoConstraints = {
            facingMode: facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 },
          };
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: videoConstraints,
              audio: true,
            });
            applyStream(stream);
          } catch (err) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: videoConstraints,
                audio: false,
              });
              applyStream(stream);
            } catch (err2) {
              camera.classList.add("hidden");
              cameraFallback.classList.remove("hidden");
              fallbackMsg.innerHTML =
                "Camera cannot be accessed.<br>Check camera permissions in your browser, then tap the switch camera button to try again.";
            }
          }
        }
        flipCamBtn.addEventListener("click", () => {
          if (recording) return;
          facingMode = facingMode === "user" ? "environment" : "user";
          startCamera();
        });
        startCamera();

        // ---- Recording ----
        function pickMimeType() {
          if (typeof MediaRecorder === "undefined") return "";
          const candidates = [
            "video/mp4;codecs=avc1,mp4a.40.2",
            "video/mp4",
            "video/webm;codecs=vp9,opus",
            "video/webm;codecs=vp8,opus",
            "video/webm",
          ];
          return (
            candidates.find((type) => MediaRecorder.isTypeSupported(type)) ||
            ""
          );
        }
        function updateRecordUI() {
          recordBtn.classList.toggle("recording", recording);
          recordBtn.setAttribute(
            "aria-label",
            recording ? "Stop recording" : "Record",
          );
        }
        function downloadRecording(blob) {
          const ext = blob.type.includes("mp4") ? "mp4" : "webm";
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `teleprompter-${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function startRecording() {
          if (!currentStream) {
            alert("Camera access is required to record.");
            return;
          }
          if (typeof MediaRecorder === "undefined") {
            alert("Recording is not supported in this browser.");
            return;
          }
          const mimeType = pickMimeType();
          try {
            mediaRecorder = mimeType
              ? new MediaRecorder(currentStream, { mimeType })
              : new MediaRecorder(currentStream);
          } catch (err) {
            alert("Recording is not supported in this browser.");
            return;
          }
          recordedChunks = [];
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            if (recordedChunks.length) {
              const blob = new Blob(recordedChunks, {
                type: mediaRecorder.mimeType || "video/webm",
              });
              downloadRecording(blob);
            }
            recordedChunks = [];
          };
          mediaRecorder.start();
          recording = true;
          updateRecordUI();
        }
        function stopRecording() {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
          recording = false;
          updateRecordUI();
        }
        recordBtn.addEventListener("click", () => {
          if (recording) {
            stopRecording();
          } else {
            startRecording();
          }
        });

        // ---- Scroll animation ----
        function pxPerSecond() {
          // speed level 1-20 -> roughly 10-250 px/s
          return 8 + speedLevel * speedLevel * 0.6;
        }

        function step(ts) {
          if (!lastTs) lastTs = ts;
          const dt = (ts - lastTs) / 1000;
          lastTs = ts;
          if (playing) {
            scrollY -= pxPerSecond() * dt;
            track.style.transform = mirrorOn
              ? `scaleX(-1) translateY(${scrollY}px)`
              : `translateY(${scrollY}px)`;
          }
          rafId = requestAnimationFrame(step);
        }
        rafId = requestAnimationFrame(step);

        function updatePlayLabel() {
          playText.textContent = playing
            ? "Pause"
            : needsCountdown
              ? "Start"
              : "Play";
        }
        function setPlaying(state) {
          cancelCountdown();
          playing = state;
          lastTs = null;
          playBtn.classList.toggle("playing", playing);
          updatePlayLabel();
          tally.classList.toggle("live", playing);
          statusLabel.classList.toggle("live", playing);
          statusLabel.textContent = playing ? "Playing" : "Paused";
          if (playing) {
            scheduleHide();
          } else {
            showControls();
          }
        }
        function cancelCountdown() {
          if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
          }
          countdown.classList.remove("show");
          playBtn.disabled = false;
        }
        function startCountdown() {
          let count = 3;
          countdown.textContent = count;
          countdown.classList.add("show");
          playBtn.disabled = true;
          countdownTimer = setInterval(() => {
            count -= 1;
            if (count > 0) {
              countdown.textContent = count;
            } else {
              cancelCountdown();
              needsCountdown = false;
              setPlaying(true);
            }
          }, 1000);
        }
        playBtn.addEventListener("click", () => {
          if (playing) {
            setPlaying(false);
          } else if (needsCountdown) {
            startCountdown();
          } else {
            setPlaying(true);
          }
        });

        // reset scroll to top
        function resetScroll() {
          scrollY = 0;
          track.style.transform = mirrorOn
            ? "scaleX(-1) translateY(0px)"
            : "translateY(0px)";
        }
        restartBtn.addEventListener("click", () => {
          if (recording) stopRecording();
          needsCountdown = true;
          setPlaying(false);
          resetScroll();
        });

        // ---- Speed / size ----
        // Speed is stored as a level 1-20 and shown as level / 6 (6 = 1.0x).
        const SPEED_MIN = 1;
        const SPEED_MAX = 20;
        const SIZE_MIN = 18;
        const SIZE_MAX = 64;
        const SIZE_STEP = 2;
        let speedLevel = 6;
        let textSize = 32;

        function updateStepperLimits() {
          document.querySelectorAll(".stepper-btn").forEach((btn) => {
            const down = btn.dataset.direction === "-1";
            const atLimit =
              btn.dataset.control === "speed"
                ? speedLevel === (down ? SPEED_MIN : SPEED_MAX)
                : textSize === (down ? SIZE_MIN : SIZE_MAX);
            btn.disabled = atLimit;
          });
        }
        function applySpeed(level) {
          speedLevel = Math.min(SPEED_MAX, Math.max(SPEED_MIN, Math.round(level)));
          speedInput.value = (speedLevel / 6).toFixed(1);
          updateStepperLimits();
        }
        speedInput.addEventListener("change", () => {
          const parsed = parseFloat(speedInput.value);
          applySpeed(Number.isNaN(parsed) ? speedLevel : parsed * 6);
        });

        function applySize(v) {
          textSize = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round(v)));
          scriptText.style.fontSize = textSize + "px";
          sizeInput.value = textSize;
          sizeInput2.value = textSize;
          updateStepperLimits();
        }
        [sizeInput, sizeInput2].forEach((input) => {
          input.addEventListener("change", () => {
            const parsed = parseInt(input.value, 10);
            applySize(Number.isNaN(parsed) ? textSize : parsed);
          });
        });
        applySize(textSize);
        applySpeed(speedLevel);

        // ---- +/- buttons (press and hold to repeat) ----
        function nudge(control, direction) {
          if (control === "speed") {
            applySpeed(speedLevel + direction);
          } else {
            applySize(textSize + direction * SIZE_STEP);
          }
        }
        document.querySelectorAll(".stepper-btn").forEach((btn) => {
          const { control } = btn.dataset;
          const direction = parseInt(btn.dataset.direction, 10);
          let holdTimer = null;
          const stopHold = () => {
            clearTimeout(holdTimer);
            holdTimer = null;
          };
          const repeat = () => {
            nudge(control, direction);
            if (btn.disabled) return stopHold();
            holdTimer = setTimeout(repeat, 80);
          };
          btn.addEventListener("pointerdown", (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            nudge(control, direction);
            holdTimer = setTimeout(repeat, 400);
          });
          ["pointerup", "pointerleave", "pointercancel"].forEach((type) =>
            btn.addEventListener(type, stopHold),
          );
          btn.addEventListener("contextmenu", (e) => e.preventDefault());
          // Keyboard activation (Enter / Space) arrives as a click with detail 0;
          // pointer presses are already handled on pointerdown.
          btn.addEventListener("click", (e) => {
            if (e.detail === 0) nudge(control, direction);
          });
        });

        // ---- Mirror ----
        let mirrorOn = false;
        mirrorBtn.addEventListener("click", () => {
          mirrorOn = !mirrorOn;
          mirrorBtn.classList.toggle("active", mirrorOn);
          track.style.transform = mirrorOn
            ? `scaleX(-1) translateY(${scrollY}px)`
            : `translateY(${scrollY}px)`;
        });

        // ---- Guide line ----
        let guideOn = false;
        guideBtn.addEventListener("click", () => {
          guideOn = !guideOn;
          guide.classList.toggle("on", guideOn);
          guideBtn.classList.toggle("active", guideOn);
        });

        // ---- Editor ----
        function openEditor() {
          if (recording) stopRecording();
          setPlaying(false);
          scriptInput.value =
            scriptText.textContent ===
            "Tap the pencil icon below to paste your script here."
              ? ""
              : scriptText.textContent;
          editor.classList.add("open");
          setTimeout(() => scriptInput.focus(), 300);
        }
        function closeEditor() {
          const val = scriptInput.value.trim();
          scriptText.textContent = val.length
            ? val
            : "Tap the pencil icon below to paste your script here.";
          editor.classList.remove("open");
          needsCountdown = true;
          resetScroll();
          updatePlayLabel();
        }
        editBtn.addEventListener("click", openEditor);
        doneBtn.addEventListener("click", closeEditor);

        // ---- Load from document (.txt / .md / .docx) ----
        function showLoadError(msg) {
          loadErrorText.textContent = msg;
          loadError.classList.add("show");
        }
        function clearLoadError() {
          loadErrorText.textContent = "";
          loadError.classList.remove("show");
        }
        loadBtn.addEventListener("click", () => {
          clearLoadError();
          fileInput.click();
        });

        // Minimal ZIP central-directory reader, just enough to pull a single
        // entry (word/document.xml) out of a .docx package without a library.
        async function readZipEntry(buffer, entryName) {
          const view = new DataView(buffer);
          const bytes = new Uint8Array(buffer);
          const maxBack = Math.min(bytes.length, 65557);
          let eocdOffset = -1;
          for (let i = bytes.length - 22; i >= bytes.length - maxBack; i--) {
            if (i < 0) break;
            if (view.getUint32(i, true) === 0x06054b50) {
              eocdOffset = i;
              break;
            }
          }
          if (eocdOffset === -1) throw new Error("Not a valid .docx file.");
          const cdCount = view.getUint16(eocdOffset + 10, true);
          let offset = view.getUint32(eocdOffset + 16, true);
          let match = null;
          for (let i = 0; i < cdCount; i++) {
            if (view.getUint32(offset, true) !== 0x02014b50) break;
            const compMethod = view.getUint16(offset + 10, true);
            const compSize = view.getUint32(offset + 20, true);
            const nameLen = view.getUint16(offset + 28, true);
            const extraLen = view.getUint16(offset + 30, true);
            const commentLen = view.getUint16(offset + 32, true);
            const localHeaderOffset = view.getUint32(offset + 42, true);
            const name = new TextDecoder("utf-8").decode(
              bytes.subarray(offset + 46, offset + 46 + nameLen),
            );
            if (name === entryName) {
              match = { compMethod, compSize, localHeaderOffset };
              break;
            }
            offset += 46 + nameLen + extraLen + commentLen;
          }
          if (!match) return null;
          const lh = match.localHeaderOffset;
          const lhNameLen = view.getUint16(lh + 26, true);
          const lhExtraLen = view.getUint16(lh + 28, true);
          const dataStart = lh + 30 + lhNameLen + lhExtraLen;
          const compData = bytes.subarray(dataStart, dataStart + match.compSize);
          if (match.compMethod === 0) return compData;
          if (match.compMethod !== 8) {
            throw new Error("Unsupported compression in .docx file.");
          }
          if (typeof DecompressionStream === "undefined") {
            throw new Error(
              "This browser can't read .docx files. Please export as .txt instead.",
            );
          }
          const stream = new Blob([compData])
            .stream()
            .pipeThrough(new DecompressionStream("deflate-raw"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }

        async function extractDocxText(file) {
          const buffer = await file.arrayBuffer();
          const xmlBytes = await readZipEntry(buffer, "word/document.xml");
          if (!xmlBytes) throw new Error("That .docx file looks corrupted.");
          const xmlText = new TextDecoder("utf-8").decode(xmlBytes);
          const xmlDoc = new DOMParser().parseFromString(
            xmlText,
            "application/xml",
          );
          const ns =
            "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
          const paragraphs = xmlDoc.getElementsByTagNameNS(ns, "p");
          const lines = [];
          const collect = (node) => {
            let text = "";
            for (const child of node.childNodes) {
              if (child.nodeType !== 1) continue;
              if (child.namespaceURI === ns && child.localName === "t") {
                text += child.textContent;
              } else if (child.namespaceURI === ns && child.localName === "tab") {
                text += "\t";
              } else if (child.namespaceURI === ns && child.localName === "br") {
                text += "\n";
              } else {
                text += collect(child);
              }
            }
            return text;
          };
          for (const p of paragraphs) lines.push(collect(p));
          return lines.join("\n\n");
        }

        fileInput.addEventListener("change", async () => {
          const file = fileInput.files[0];
          fileInput.value = "";
          if (!file) return;
          const name = file.name.toLowerCase();
          if (name.endsWith(".docx")) {
            try {
              const text = await extractDocxText(file);
              clearLoadError();
              scriptInput.value = text;
            } catch (err) {
              showLoadError(err.message || "Could not read that .docx file.");
            }
            return;
          }
          if (!name.endsWith(".txt") && !name.endsWith(".md")) {
            showLoadError("Only .txt, .md, or .docx files are supported.");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            clearLoadError();
            scriptInput.value = reader.result;
          };
          reader.onerror = () => {
            showLoadError("Could not read that file. Please try again.");
          };
          reader.readAsText(file);
        });

        // ---- Auto-hide controls while playing ----
        function showControls() {
          controlsVisible = true;
          topbar.classList.remove("hide");
          dock.classList.remove("hide");
          clearTimeout(hideTimer);
          if (playing) scheduleHide();
        }
        function scheduleHide() {
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            controlsVisible = false;
            topbar.classList.add("hide");
            dock.classList.add("hide");
          }, 2600);
        }
        dock.addEventListener("pointerdown", () => {
          if (playing) scheduleHide();
        });
        stage.addEventListener("click", () => {
          if (controlsVisible && playing) {
            topbar.classList.add("hide");
            dock.classList.add("hide");
            controlsVisible = false;
            clearTimeout(hideTimer);
          } else {
            showControls();
          }
        });

        // ---- Fullscreen ----
        fullscreenBtn.addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.();
          }
        });

        // ---- Keyboard shortcuts ----
        document.addEventListener("keydown", (e) => {
          if (editor.classList.contains("open")) return;
          const tag = document.activeElement.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA") return;
          if (e.code === "Space") {
            e.preventDefault();
            playBtn.click();
          } else if (e.key.toLowerCase() === "r") {
            restartBtn.click();
          }
        });

        // Reset scroll on double tap
        let lastTap = 0;
        document.addEventListener("touchend", (e) => {
          if (e.target.closest("#dock, #topbar, #editor")) return;
          const now = Date.now();
          if (now - lastTap < 300) {
            resetScroll();
          }
          lastTap = now;
        });
      })();
    </script>
  </body>
</html>
